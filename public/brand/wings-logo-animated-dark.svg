<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1774 887" role="img" aria-labelledby="title desc" style="display:block;border:0;outline:0">
  <title id="title">Wings</title>
  <desc id="desc">The wings wordmark writes in one continuous stroke, followed by unfolding feathers and a soft colored glow.</desc>
  <style>
    .main-guide, .return-guide { animation: draw-main 3.903578s linear forwards; }
    .feather-guide { animation: draw-feather .85s ease-out 4.303578s forwards; }
    .main-complete { animation: reveal-all .01s linear 3.903578s forwards; }
    .feather-complete { animation: reveal-all .01s linear 5.153578s forwards; }
    .i-dot { opacity: 0; animation: reveal-all .30s ease-out 3.923578s forwards, glow-in .4s ease-out 5.18s forwards; }
    svg > path[mask], svg > g[mask], .i-dot { fill: url(#logo-color); filter: none; }
    svg > path[mask], svg > g[mask] { animation: glow-in .4s ease-out 5.18s forwards; }
    @keyframes draw-main {
      0% { stroke-dashoffset: 3539; animation-timing-function: cubic-bezier(0.55701165,0.02023036,0.75072542,0.50014981); }
      39.189058% { stroke-dashoffset: 1882.748000; animation-timing-function: steps(1,end); }
      39.191619% { stroke-dashoffset: 1677.486000; animation-timing-function: cubic-bezier(0.17343170,0.50856978,0.40847474,1.00000000); }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes draw-feather { to { stroke-dashoffset: 0; } }
    @keyframes reveal-all { to { opacity: 1; } }
    @keyframes glow-in { to { filter: drop-shadow(0 0 4px #67ddff) drop-shadow(0 0 11px #977cff); } }
    @media (prefers-reduced-motion: reduce) {
      .main-guide, .return-guide, .feather-guide { animation: none; stroke-dashoffset: 0; }
      .main-complete, .feather-complete, .i-dot { animation: none; opacity: 1; }
      svg > path[mask], svg > g[mask], .i-dot { animation: none; filter: drop-shadow(0 0 4px #67ddff) drop-shadow(0 0 11px #977cff); }
    }
  </style>
